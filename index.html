<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard de Viagens | Suporte</title>
<link rel="icon" type="image/png" href="logo.png">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
button:focus,input:focus,select:focus{outline:none!important;box-shadow:none!important}
.fade-in{animation:fi .4s ease-out}@keyframes fi{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.custom-scrollbar::-webkit-scrollbar{width:6px;height:6px}.custom-scrollbar::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
#toasts{position:fixed;top:70px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 18px;border-radius:10px;border-left:4px solid;box-shadow:0 10px 25px rgba(0,0,0,.15);font-size:13px;font-weight:600;animation:fi .3s}
.t-success{background:#ecfdf5;border-color:#10b981;color:#065f46}.t-error{background:#fef2f2;border-color:#ef4444;color:#991b1b}.t-info{background:#eff6ff;border-color:#3b82f6;color:#1e40af}
table.cal td,table.cal th{border:1px solid #94a3b8;text-align:center}
body.tv table.cal{font-size:1.25rem}
body.tv #titulo{font-size:2.5rem}
</style>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800">
<div id="toasts"></div>

<!-- LOGIN -->
<div id="authView" class="hidden flex items-center justify-center min-h-screen bg-slate-900">
  <form id="loginForm" class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md border-t-4 border-blue-600 space-y-4">
    <div class="flex justify-center"><img src="logo.png" class="h-16" alt="Logo"></div>
    <h2 class="text-xl font-bold text-center uppercase tracking-wider">Dashboard de Viagens</h2>
    <input id="lUser" required placeholder="nome.sobrenome" class="w-full px-3 py-2.5 border rounded bg-slate-50 text-sm lowercase">
    <input id="lPass" type="password" required placeholder="Senha" class="w-full px-3 py-2.5 border rounded bg-slate-50 text-sm">
    <button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded">Acessar</button>
  </form>
</div>

<!-- APP -->
<div id="appView" class="hidden min-h-screen flex">
  <aside id="sidebar" class="hidden w-56 bg-slate-900 text-slate-200 p-4 space-y-2 shrink-0">
    <p class="text-[10px] font-bold uppercase text-slate-500 mb-2">Gestão</p>
    <button onclick="abrirEvento()" class="w-full text-left px-3 py-2 rounded bg-emerald-600 hover:bg-emerald-700 text-sm font-bold"><i class="fa-solid fa-plus mr-2"></i>Novo evento</button>
    <button onclick="abrirArquivos()" class="w-full text-left px-3 py-2 rounded hover:bg-slate-800 text-sm font-bold"><i class="fa-solid fa-folder-open mr-2"></i>Arquivos</button>
    <button onclick="novaPlanilha()" class="w-full text-left px-3 py-2 rounded hover:bg-slate-800 text-sm font-bold"><i class="fa-solid fa-file-circle-plus mr-2"></i>Nova planilha</button>
    <button onclick="renomearPlanilha()" class="w-full text-left px-3 py-2 rounded hover:bg-slate-800 text-sm font-bold"><i class="fa-solid fa-pen mr-2"></i>Renomear planilha</button>
    <button onclick="abrirUsuario()" class="w-full text-left px-3 py-2 rounded hover:bg-slate-800 text-sm font-bold"><i class="fa-solid fa-user-plus mr-2"></i>Criar usuário</button>
    <button onclick="irParaViagens()" class="w-full text-left px-3 py-2 rounded hover:bg-slate-800 text-sm font-bold"><i class="fa-solid fa-clock mr-2"></i>Viagens (horas)</button>
  </aside>
  <div class="flex-1 min-w-0">
    <header class="bg-slate-900 border-b border-slate-700 h-14 px-4 flex items-center justify-between sticky top-0 z-40">
      <div class="flex items-center gap-3"><img src="logo.png" class="h-9 bg-white rounded p-1" alt=""><h1 class="text-white font-bold hidden sm:block">Dashboard de Viagens</h1></div>
      <div class="flex items-center gap-4">
        <span class="text-[10px] font-bold text-emerald-400 uppercase flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>Ao vivo</span>
        <button id="lnkViagens" onclick="irParaViagens()" class="hidden bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-3 py-1.5 rounded"><i class="fa-solid fa-clock mr-1"></i>Viagens</button>
        <span id="uNome" class="text-sm text-white hidden md:block"></span>
        <button onclick="logout()" class="text-slate-400 hover:text-red-400 text-sm font-semibold"><i class="fa-solid fa-power-off mr-1"></i>Sair</button>
      </div>
    </header>
    <main class="p-4">
      <div id="aviso" class="hidden mb-3 bg-amber-50 border border-amber-300 text-amber-800 rounded-lg px-4 py-2 text-sm font-semibold"></div>
      <div id="scroller" class="bg-white rounded-xl shadow-sm border overflow-auto custom-scrollbar">
        <h2 id="titulo" class="text-center text-2xl md:text-3xl font-black py-3 border-b-2 border-slate-800"></h2>
        <table class="cal min-w-full text-sm">
          <thead><tr id="thead" class="bg-blue-700 text-white"></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<!-- MODAL EVENTO -->
<div id="mEvento" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
  <div class="bg-white p-6 rounded-xl shadow-xl w-full max-w-lg border-t-4 border-emerald-600 max-h-[95vh] overflow-y-auto space-y-3">
    <h3 class="text-lg font-bold"><i class="fa-solid fa-calendar-plus text-emerald-600 mr-2"></i><span id="mEvTitulo">Novo evento</span></h3>
    <input type="hidden" id="eId">
    <div class="grid grid-cols-2 gap-3">
      <div><label class="text-[10px] font-bold text-slate-500">FILIAL</label><input id="eFilial" maxlength="3" class="w-full px-3 py-2 text-sm border rounded uppercase bg-slate-50"></div>
      <div><label class="text-[10px] font-bold text-slate-500">POSTO/EXPOSIÇÃO</label><input id="ePosto" class="w-full px-3 py-2 text-sm border rounded uppercase bg-slate-50"></div>
    </div>
    <div><label class="text-[10px] font-bold text-slate-500">TIPO DE EVENTO</label>
      <select id="eTipo" onchange="checkOutrosEv()" class="w-full px-3 py-2 text-sm border rounded bg-slate-50 mb-2"><option>Inauguração</option><option>Reinauguração</option><option>Mudança de status</option><option>Pc-á-pc</option><option>Impressoras</option><option>Networking</option><option value="Outros">Outros...</option></select>
      <input id="eOutros" placeholder="Especifique o tipo..." class="hidden w-full px-3 py-2 text-sm border rounded bg-white"></div>
    <div class="grid grid-cols-3 gap-3">
      <div><label class="text-[10px] font-bold text-slate-500">ENVIO EQUIP.</label><input type="date" id="eEnvio" class="w-full px-2 py-2 text-sm border rounded bg-slate-50"></div>
      <div><label class="text-[10px] font-bold text-slate-500">SAÍDA</label><input type="date" id="eSaida" class="w-full px-2 py-2 text-sm border rounded bg-slate-50"></div>
      <div><label class="text-[10px] font-bold text-slate-500">DATA EVENTO</label><input type="date" id="eData" class="w-full px-2 py-2 text-sm border rounded bg-slate-50"></div>
    </div>
    <div><label class="text-[10px] font-bold text-slate-500">Nº DA VIAGEM <span class="text-slate-400">(visível só para Gerência/Coordenação)</span></label><input id="eNum" class="w-full px-3 py-2 text-sm border rounded bg-slate-50"></div>
    <div><label class="text-[10px] font-bold text-slate-500">EQUIPE <span id="eCont" class="text-emerald-600"></span></label>
      <input id="eBusca" oninput="renderTecs()" placeholder="Buscar técnico..." class="w-full px-3 py-2 text-sm border rounded bg-slate-50 mb-2">
      <div id="eTecs" class="max-h-40 overflow-auto custom-scrollbar border rounded"></div></div>
    <p class="text-[11px] text-slate-500">Ao salvar, a viagem (projeto de horas) é criada para cada técnico selecionado e o dashboard atualiza na hora para todos.</p>
    <div class="flex justify-end gap-2"><button onclick="fechar('mEvento')" class="px-4 py-2 text-sm font-bold text-slate-500">Cancelar</button><button id="btnSalvarEv" onclick="salvarEvento()" class="px-4 py-2 text-sm font-bold bg-emerald-600 hover:bg-emerald-700 text-white rounded">Salvar</button></div>
  </div>
</div>

<!-- MODAL ARQUIVOS -->
<div id="mArq" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
  <div class="bg-white p-6 rounded-xl shadow-xl w-full max-w-md border-t-4 border-blue-600 space-y-3">
    <h3 class="text-lg font-bold"><i class="fa-solid fa-folder-open text-blue-600 mr-2"></i>Planilhas</h3>
    <div id="arqLista" class="max-h-72 overflow-auto custom-scrollbar space-y-2"></div>
    <div class="flex justify-end"><button onclick="fechar('mArq')" class="px-4 py-2 text-sm font-bold text-slate-500">Fechar</button></div>
  </div>
</div>

<!-- MODAL USUÁRIO -->
<div id="mUser" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
  <div class="bg-white p-6 rounded-xl shadow-xl w-full max-w-sm border-t-4 border-slate-800 space-y-3">
    <h3 class="text-lg font-bold"><i class="fa-solid fa-user-plus mr-2"></i>Criar usuário</h3>
    <div class="grid grid-cols-2 gap-3"><input id="uNomeN" placeholder="Nome" class="px-3 py-2 text-sm border rounded bg-slate-50"><input id="uSobN" placeholder="Sobrenome" class="px-3 py-2 text-sm border rounded bg-slate-50"></div>
    <select id="uEquipe" class="w-full px-3 py-2 text-sm border rounded bg-slate-50"><option value="-">Sem equipe</option><option value="Anna">Equipe Anna</option><option value="Didi">Equipe Didi</option></select>
    <select id="uNivel" class="w-full px-3 py-2 text-sm border rounded bg-slate-50"><option>Suporte NN</option><option>Suporte N1</option><option>Suporte N2</option><option>Suporte N3</option><option>Analista de Suporte - N1</option><option>Analista de Suporte N2</option><option>Coordenação GS</option><option>Gerência GS</option><option>Monitor</option></select>
    <input id="uSenha" type="password" placeholder="Senha" class="w-full px-3 py-2 text-sm border rounded bg-slate-50">
    <div class="flex justify-end gap-2"><button onclick="fechar('mUser')" class="px-4 py-2 text-sm font-bold text-slate-500">Cancelar</button><button onclick="criarUsuario()" class="px-4 py-2 text-sm font-bold bg-slate-800 text-white rounded">Criar</button></div>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyv6rztF_a5ePHzRhzCMJDawDOHhF-le_3MgvoeMY2WUGjVRQBPmt2cSuV6Mp71MGnpUQ/exec";
const SESSAO_MS = 4 * 60 * 60 * 1000, POLL_MS = 8000;
const MESES = ['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];
const VIAGENS_URL = "https://viagens-gs.vercel.app/";

// ===== LOGIN ÚNICO ENTRE SISTEMAS (recebe a sessão vinda do viagens-gs) =====
(function consumirSSO() {
  const m = location.hash.match(/^#sso=(.+)$/);
  if (!m) return;
  try {
    const o = JSON.parse(decodeURIComponent(escape(atob(m[1]))));
    const t = parseInt(o.t, 10);
    if (o && o.u && o.u.login && t && (/Monitor/i.test(o.u.nivel || '') || Date.now() - t < SESSAO_MS)) {
      localStorage.setItem('usuarioAtivo', JSON.stringify(o.u));
      localStorage.setItem('loginTimestamp', String(/Monitor/i.test(o.u.nivel || '') ? Date.now() : t));
    }
  } catch (e) {}
  history.replaceState(null, '', location.pathname + location.search);
})();

function irParaViagens() {
  if (!user) return;
  const pacote = { u: user, t: localStorage.getItem('loginTimestamp') || Date.now().toString() };
  const payload = btoa(unescape(encodeURIComponent(JSON.stringify(pacote))));
  window.location.href = VIAGENS_URL + '#sso=' + payload;
}

const RX_GESTAO = /Coordena|Ger[eê]ncia/i;
const TIPOS_FIXOS = ['Inauguração','Reinauguração','Mudança de status','Pc-á-pc','Impressoras','Networking'];
const $ = id => document.getElementById(id);
const esc = v => String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
let user = null, planilhas = [], planId = '', eventos = [], usuarios = [], tecSel = new Set(), busy = 0, lastSig = '', timer = null, tvTimer = null;
const isGestao = () => !!user && RX_GESTAO.test(user.nivel || '');
const isMonitor = () => !!user && /Monitor/i.test(user.nivel || '');

function toast(msg, type = 'info') { const t = document.createElement('div'); t.className = 'toast t-' + type; t.textContent = msg; $('toasts').appendChild(t); setTimeout(() => t.remove(), 4000); }
async function post(d) { try { const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(d) }); return await r.json(); } catch (e) { return null; } }
const fechar = id => $(id).classList.add('hidden');

// ===== datas / status automático =====
const p2 = n => String(n).padStart(2, '0');
function hojeISO() { const d = new Date(); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
const fmt = iso => iso ? iso.split('-').reverse().join('/') : '';
// Pendente -> dia da saída: trânsito -> depois: andamento -> dia do evento: concluindo -> dia seguinte: concluído
function statusEvento(ev) {
  const h = hojeISO();
  if (ev.dataEvento && h > ev.dataEvento) return { txt: 'Concluído', cls: 'text-emerald-600' };
  if (ev.dataEvento && h === ev.dataEvento) return { txt: ev.tipo + ' concluindo', cls: 'text-purple-700' };
  if (ev.dataSaida && h === ev.dataSaida) return { txt: 'Em viagem: trânsito', cls: 'text-blue-600' };
  if (ev.dataSaida && h > ev.dataSaida) return { txt: 'Projeto em andamento', cls: 'text-amber-600' };
  return { txt: 'Pendente', cls: 'text-red-600' };
}
function primeiroNome(login) {
  const u = usuarios.find(x => String(x.login).toLowerCase() === String(login).toLowerCase());
  const n = u ? String(u.nome).split(' ')[0] : String(login).split('.')[0];
  return n.charAt(0).toUpperCase() + n.slice(1).toLowerCase();
}

// ===== sessão =====
window.onload = () => {
  const u = localStorage.getItem('usuarioAtivo'), t = localStorage.getItem('loginTimestamp');
  if (u && t) {
    try { const o = JSON.parse(u); if (/Monitor/i.test(o.nivel || '') || Date.now() - parseInt(t) < SESSAO_MS) { user = o; return iniciar(); } } catch (e) {}
  }
  $('authView').classList.remove('hidden');
};
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const r = await post({ action: 'login', login: $('lUser').value.trim(), senha: $('lPass').value });
  if (r && r.success) { localStorage.setItem('usuarioAtivo', JSON.stringify(r.user)); localStorage.setItem('loginTimestamp', Date.now().toString()); user = r.user; iniciar(); }
  else toast((r && r.message) || 'Erro de conexão', 'error');
});
function logout() { clearInterval(timer); clearInterval(tvTimer); localStorage.removeItem('usuarioAtivo'); localStorage.removeItem('loginTimestamp'); location.reload(); }

async function iniciar() {
  $('authView').classList.add('hidden'); $('appView').classList.remove('hidden');
  $('uNome').textContent = user.nome + ' ' + user.sobrenome;
  $('sidebar').classList.toggle('hidden', !isGestao());
  $('lnkViagens').classList.toggle('hidden', isGestao() || isMonitor());
  if (isMonitor()) { document.body.classList.add('tv'); iniciarAutoScroll(); }
  const u = await post({ action: 'getUsers' }); if (u && u.success) usuarios = u.users;
  await carregar();
  timer = setInterval(() => {
    if (!isMonitor() && Date.now() - parseInt(localStorage.getItem('loginTimestamp') || 0) >= SESSAO_MS) return logout();
    if (!document.hidden && busy === 0) carregar();
  }, POLL_MS);
}

// TV: rola a tabela devagar quando não cabe na tela
function iniciarAutoScroll() {
  let dir = 1, pausa = 0;
  tvTimer = setInterval(() => {
    const w = document.documentElement;
    const max = w.scrollHeight - w.clientHeight;
    if (max <= 5) return;
    if (pausa > 0) { pausa--; return; }
    const y = window.scrollY + dir;
    window.scrollTo(0, y);
    if (y >= max) { dir = -1; pausa = 100; } else if (y <= 0) { dir = 1; pausa = 100; }
  }, 40);
}

async function carregar() {
  const r = await post({ action: 'dashGet', login: user.login, nivel: user.nivel, planilhaId: planId });
  if (!r || !r.success) return;
  planilhas = r.planilhas; planId = r.planilhaId; eventos = r.eventos;
  const sig = JSON.stringify(r) + hojeISO();
  if (sig === lastSig) return; lastSig = sig;
  render();
}

function render() {
  const pl = planilhas.find(p => p.id === planId);
  const ev = eventos.slice().sort((a, b) => a.dataEvento.localeCompare(b.dataEvento));
  const meses = [...new Set(ev.map(e => +e.dataEvento.slice(5, 7)).filter(Boolean))].map(m => MESES[m - 1]);
  const ano = ev.length ? ev[0].dataEvento.slice(0, 4) : new Date().getFullYear();
  $('titulo').textContent = pl ? 'Calendário com eventos para ' + (pl.titulo || (meses.join(' e ') + ' de ' + ano)) : 'Nenhuma planilha ativa';
  const av = $('aviso');
  if (isGestao() && pl && !pl.ativa) { av.textContent = 'Você está vendo uma planilha que NÃO está exibida para o suporte. Use "Arquivos" > Ativar para publicá-la.'; av.classList.remove('hidden'); }
  else if (isGestao() && !pl) { av.textContent = 'Crie uma planilha em "Nova planilha" para começar.'; av.classList.remove('hidden'); }
  else av.classList.add('hidden');
  const g = isGestao();
  $('thead').innerHTML = ['Filial','Posto/Exposição','Tipo de evento','Data','Envio dos Equip.','Equipe','Data da saída','Status'].concat(g ? ['Nº Viagem','Ações'] : []).map(h => `<th class="px-3 py-3 font-bold">${h}</th>`).join('');
  let html = '', mesAtual = null;
  const cols = g ? 10 : 8;
  if (!ev.length) html = `<tr><td colspan="${cols}" class="p-10 text-slate-400">Nenhum evento cadastrado.</td></tr>`;
  ev.forEach(e => {
    const m = +e.dataEvento.slice(5, 7);
    if (mesAtual !== null && m !== mesAtual) html += `<tr><td colspan="${cols}" class="font-black py-1 bg-white">${MESES[m - 1]}</td></tr>`;
    mesAtual = m;
    const s = statusEvento(e);
    const equipe = e.equipe.split(',').filter(Boolean).map(primeiroNome).join(' / ');
    html += `<tr class="fade-in bg-white font-semibold"><td class="px-3 py-2 font-black">${esc(e.filial)}</td><td class="px-3 py-2">${esc(e.posto)}</td><td class="px-3 py-2">${esc(e.tipo)}</td><td class="px-3 py-2 font-bold" style="background:#92d050">${fmt(e.dataEvento)}</td><td class="px-3 py-2 font-bold" style="background:#fff2cc">${fmt(e.dataEnvio)}</td><td class="px-3 py-2 font-bold">${esc(equipe)}</td><td class="px-3 py-2 font-bold" style="background:#ffc000">${fmt(e.dataSaida)}</td><td class="px-3 py-2 font-bold ${s.cls}">${esc(s.txt)}</td>`;
    if (g) html += `<td class="px-3 py-2 font-mono text-xs">${esc(e.numViagem || '-')}</td><td class="px-3 py-2 whitespace-nowrap"><button onclick="abrirEvento('${e.id}')" class="text-slate-400 hover:text-orange-500 mr-3"><i class="fa-solid fa-pen"></i></button><button onclick="excluirEvento('${e.id}')" class="text-slate-400 hover:text-red-500"><i class="fa-solid fa-trash"></i></button></td>`;
    html += '</tr>';
  });
  $('tbody').innerHTML = html;
}

// ===== evento =====
function checkOutrosEv() { const o = $('eTipo').value === 'Outros'; $('eOutros').classList.toggle('hidden', !o); if (!o) $('eOutros').value = ''; }
function abrirEvento(id) {
  if (!planId) return toast('Crie uma planilha primeiro.', 'error');
  const e = (id && eventos.find(x => x.id === id)) || {};
  $('mEvTitulo').textContent = id ? 'Editar evento' : 'Novo evento';
  $('eId').value = e.id || ''; $('eFilial').value = e.filial || ''; $('ePosto').value = e.posto || '';
  if (e.tipo && TIPOS_FIXOS.indexOf(e.tipo) === -1) { $('eTipo').value = 'Outros'; checkOutrosEv(); $('eOutros').value = e.tipo; }
  else { $('eTipo').value = e.tipo || 'Inauguração'; checkOutrosEv(); }
  $('eEnvio').value = e.dataEnvio || ''; $('eSaida').value = e.dataSaida || '';
  $('eData').value = e.dataEvento || ''; $('eNum').value = e.numViagem || ''; $('eBusca').value = '';
  tecSel = new Set(String(e.equipe || '').split(',').filter(Boolean).map(s => s.toLowerCase()));
  renderTecs(); $('mEvento').classList.remove('hidden');
}
function renderTecs() {
  const q = $('eBusca').value.toLowerCase(), box = $('eTecs'); box.innerHTML = '';
  usuarios.filter(u => !RX_GESTAO.test(u.nivel || '') && !/Monitor/i.test(u.nivel || '') && (u.nome + ' ' + u.login).toLowerCase().includes(q)).forEach(u => {
    const lg = String(u.login).toLowerCase();
    const lb = document.createElement('label'); lb.className = 'flex items-center gap-2 px-3 py-2 border-b text-sm cursor-pointer hover:bg-slate-50';
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.className = 'h-4 w-4 accent-emerald-600'; cb.checked = tecSel.has(lg);
    cb.onchange = () => { cb.checked ? tecSel.add(lg) : tecSel.delete(lg); $('eCont').textContent = `(${tecSel.size})`; };
    lb.appendChild(cb); lb.insertAdjacentHTML('beforeend', `<span><b>${esc(u.nome)}</b> <span class="text-[11px] text-slate-400 font-mono">${esc(u.login)}</span></span>`);
    box.appendChild(lb);
  });
  $('eCont').textContent = `(${tecSel.size})`;
}
async function salvarEvento() {
  let tipo = $('eTipo').value; if (tipo === 'Outros') tipo = $('eOutros').value.trim();
  const ev = { id: $('eId').value, filial: $('eFilial').value.trim().toUpperCase(), posto: $('ePosto').value.trim().toUpperCase(), tipo, dataEnvio: $('eEnvio').value, dataSaida: $('eSaida').value, dataEvento: $('eData').value, numViagem: $('eNum').value.trim(), equipe: [...tecSel].join(',') };
  if (!ev.filial || !ev.tipo || !ev.dataEvento || !ev.dataSaida || !tecSel.size) return toast('Informe filial, tipo, datas de saída/evento e ao menos um técnico.', 'error');
  if (ev.dataSaida > ev.dataEvento) return toast('A data da saída não pode ser depois da data do evento.', 'error');
  const b = $('btnSalvarEv'); b.disabled = true; busy++;
  const r = await post({ action: 'dashSalvarEvento', nivel: user.nivel, login: user.login, planilhaId: planId, evento: ev });
  busy--; b.disabled = false;
  if (r && r.success) { fechar('mEvento'); toast('Evento salvo e viagens geradas para a equipe.', 'success'); lastSig = ''; carregar(); }
  else toast((r && r.message) || 'Falha ao salvar.', 'error');
}
async function excluirEvento(id) {
  if (!confirm('Excluir este evento do dashboard?')) return;
  const r = await post({ action: 'dashExcluirEvento', nivel: user.nivel, id });
  if (r && r.success) { toast('Evento excluído.', 'success'); lastSig = ''; carregar(); } else toast('Falha ao excluir.', 'error');
}

// ===== planilhas =====
async function novaPlanilha() {
  const t = prompt('Título da nova planilha (ex.: NOVEMBRO e DEZEMBRO de 2026):'); if (!t) return;
  const r = await post({ action: 'dashNovaPlanilha', nivel: user.nivel, login: user.login, titulo: t });
  if (r && r.success) { planId = r.id; toast('Planilha criada e ativada.', 'success'); lastSig = ''; carregar(); } else toast('Falha ao criar.', 'error');
}
async function renomearPlanilha() {
  const pl = planilhas.find(p => p.id === planId); if (!pl) return toast('Nenhuma planilha selecionada.', 'error');
  const t = prompt('Novo título:', pl.titulo); if (!t) return;
  const r = await post({ action: 'dashRenomearPlanilha', nivel: user.nivel, id: planId, titulo: t });
  if (r && r.success) { toast('Título alterado.', 'success'); lastSig = ''; carregar(); } else toast('Falha ao renomear.', 'error');
}
function abrirArquivos() {
  $('arqLista').innerHTML = planilhas.map(p => `<div class="flex items-center justify-between border rounded p-3 ${p.id === planId ? 'border-blue-500 bg-blue-50' : ''}"><div><p class="text-sm font-bold">${esc(p.titulo)}</p><p class="text-[10px] text-slate-500">${p.ativa ? 'Exibida para o suporte' : 'Arquivada (só Gestão vê)'}</p></div><div class="flex gap-3"><button onclick="verPlanilha('${p.id}')" class="text-xs font-bold text-blue-600">Ver</button>${p.ativa ? '' : `<button onclick="ativarPlanilha('${p.id}')" class="text-xs font-bold text-emerald-600">Ativar</button>`}<button onclick="excluirPlanilha('${p.id}')" class="text-xs font-bold text-red-600">Excluir</button></div></div>`).join('') || '<p class="text-sm text-slate-400 text-center">Nenhuma planilha.</p>';
  $('mArq').classList.remove('hidden');
}
function verPlanilha(id) { planId = id; lastSig = ''; fechar('mArq'); carregar(); }
async function ativarPlanilha(id) { await post({ action: 'dashAtivarPlanilha', nivel: user.nivel, id }); planId = id; lastSig = ''; fechar('mArq'); toast('Planilha ativada para o suporte.', 'success'); carregar(); }
async function excluirPlanilha(id) {
  if (!confirm('Excluir esta planilha e todos os eventos dela?')) return;
  const r = await post({ action: 'dashExcluirPlanilha', nivel: user.nivel, id });
  if (r && r.success) { if (planId === id) planId = ''; fechar('mArq'); toast('Planilha excluída.', 'success'); lastSig = ''; carregar(); } else toast('Falha ao excluir.', 'error');
}

// ===== usuário =====
function abrirUsuario() { ['uNomeN','uSobN','uSenha'].forEach(i => $(i).value = ''); $('mUser').classList.remove('hidden'); }
async function criarUsuario() {
  const d = { action: 'dashCriarUsuario', nivel: user.nivel, nome: $('uNomeN').value, sobrenome: $('uSobN').value, senha: $('uSenha').value, equipe: $('uEquipe').value, nivelNovo: $('uNivel').value };
  if (!d.nome || !d.sobrenome || !d.senha) return toast('Preencha nome, sobrenome e senha.', 'error');
  const r = await post(d);
  if (r && r.success) { toast('Usuário criado: ' + r.login, 'success'); fechar('mUser'); const u = await post({ action: 'getUsers' }); if (u && u.success) usuarios = u.users; }
  else toast((r && r.message) || 'Erro ao criar.', 'error');
}
</script>
